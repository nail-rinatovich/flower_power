# Free demo: SQLite and uploaded photos are ephemeral on Render Free.
services:
  - type: web
    name: flower-power
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "1"
